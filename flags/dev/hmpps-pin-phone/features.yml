version: "1.6"
namespace:
    key: hmpps-pin-phone
    name: hmpps-pin-phone
    description: Digital pin phone service for prisoners
segments:
    - key: view-contacts-active-prisons
      name: view-contacts-active prisons
      description: Prisons where prisoners can view contacts
      constraints:
        - type: STRING_COMPARISON_TYPE
          property: prisonId
          operator: isoneof
          value:
            - BWI
            - CKI
            - EEI
            - RNI
          description: Prisons where prisoners can view contacts
      match_type: ALL_MATCH_TYPE
