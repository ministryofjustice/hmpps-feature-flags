# Enforces the flag review policy via the `flag-approval` commit status
# (a required check in the main ruleset, pinned to the HMPPS Feature Flags app):
#
#   1. Non-production flag changes: auto-approved by the bot, no review needed
#   2. Production flag changes: blocked until someone on the namespace's
#      `writers` list (flags/prod/{ns}/access.yml) approves
#   3. Production flag changes in a namespace with `prodSelfService: true`:
#      auto-approved by the bot, no review needed
#
# Anything outside flags/ is not this workflow's problem - CODEOWNERS keeps
# admin review on those files.
#
# Runs on pull_request_target and always checks out main, so the policy and
# the access.yml opt-ins come from main - a PR can't opt itself in, and no
# code from the PR branch is ever executed here.
name: Flag Approval

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  flag_approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.FLAG_APPROVAL_APP_ID }}
          private-key: ${{ secrets.FLAG_APPROVAL_APP_PRIVATE_KEY }}
          owner: ministryofjustice
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs')

            const MARKER = '<!-- flag-approval-bot -->'
            const STATUS_CONTEXT = 'flag-approval'
            const ORG = 'ministryofjustice'
            const ADMIN_TEAM = 'hmpps-feature-flag-admins'
            const BOT_LOGIN = 'hmpps-feature-flags[bot]'

            const pr = context.payload.pull_request
            const repo = { owner: context.repo.owner, repo: context.repo.repo }

            if (pr.base.ref !== context.payload.repository.default_branch) {
              return
            }

            const setStatus = (state, description) =>
              github.rest.repos.createCommitStatus({
                ...repo,
                sha: pr.head.sha,
                context: STATUS_CONTEXT,
                state,
                description,
              })

            // access.yml is canonical-formatted (enforced by make flags-lint),
            // so a light regex parse is safe. Namespaces without one (e.g.
            // `default`) fall back to admin ownership.
            const readProdAccess = (namespace) => {
              const path = `flags/prod/${namespace}/access.yml`

              if (!fs.existsSync(path)) {
                return { writers: [ADMIN_TEAM], selfService: false }
              }

              const content = fs.readFileSync(path, 'utf8')
              const writers = [...content.matchAll(/^\s+-\s+(\S+)\s*$/gm)].map((m) => m[1])

              return {
                writers: writers.length > 0 ? writers : [ADMIN_TEAM],
                selfService: /^prodSelfService:\s*true\s*$/m.test(content),
              }
            }

            const membershipCache = new Map()
            const isTeamMember = (team, username) => {
              const key = `${team}:${username}`

              if (!membershipCache.has(key)) {
                membershipCache.set(
                  key,
                  github.rest.teams
                    .getMembershipForUserInOrg({ org: ORG, team_slug: team, username })
                    .then((response) => response.data.state === 'active', () => false),
                )
              }

              return membershipCache.get(key)
            }

            const isWriter = async (writers, username) => {
              const results = await Promise.all(writers.map((team) => isTeamMember(team, username)))

              return results.some(Boolean)
            }

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              ...repo,
              pull_number: pr.number,
              per_page: 100,
            })

            const featuresPattern = /^flags\/(dev|preprod|prod)\/([^/]+)\/features\.ya?ml$/
            const touchedNamespaces = new Map()
            let onlyFlagFiles = changedFiles.length > 0

            for (const file of changedFiles) {
              for (const path of [file.filename, file.previous_filename].filter(Boolean)) {
                const match = path.match(featuresPattern)

                if (!match) {
                  onlyFlagFiles = false
                  continue
                }

                const namespace = match[2]
                const touchesProd = touchedNamespaces.get(namespace)?.touchesProd || match[1] === 'prod'

                touchedNamespaces.set(namespace, { ...readProdAccess(namespace), touchesProd })
              }
            }

            // A namespace gates the PR when its prod flags change without
            // self-service, or when the author isn't on its writers list.
            const gates = []
            let selfServiceApplied = false

            for (const [namespace, access] of touchedNamespaces) {
              if (access.touchesProd && !access.selfService) {
                gates.push({ namespace, writers: access.writers })
              } else if (!(await isWriter(access.writers, pr.user.login))) {
                gates.push({ namespace, writers: access.writers })
              } else if (access.touchesProd) {
                selfServiceApplied = true
              }
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...repo,
              pull_number: pr.number,
              per_page: 100,
            })
            const botApprovals = reviews.filter(
              (review) => review.user?.login === BOT_LOGIN && review.state === 'APPROVED',
            )
            const humanApprovers = [
              ...new Set(
                reviews
                  .filter(
                    (review) =>
                      review.state === 'APPROVED' &&
                      review.commit_id === pr.head.sha &&
                      review.user?.login !== BOT_LOGIN &&
                      review.user?.login !== pr.user.login,
                  )
                  .map((review) => review.user.login),
              ),
            ]

            const gateSatisfied = async (gate) => {
              const checks = await Promise.all(
                humanApprovers.map((username) => isWriter(gate.writers, username)),
              )

              return checks.some(Boolean)
            }

            const unsatisfiedGates = []
            for (const gate of gates) {
              if (!(await gateSatisfied(gate))) {
                unsatisfiedGates.push(gate)
              }
            }

            const autoApprovable = onlyFlagFiles && gates.length === 0
            let body

            if (autoApprovable) {
              if (!botApprovals.some((review) => review.commit_id === pr.head.sha)) {
                await github.rest.pulls.createReview({
                  ...repo,
                  pull_number: pr.number,
                  event: 'APPROVE',
                })
              }

              body = selfServiceApplied
                ? `${MARKER}\n✅ **Namespace has prod self-approval** - production flag changes here opted in via \`prodSelfService: true\`. No review needed, merge when the checks are green.`
                : `${MARKER}\n✅ **Auto-approved** - non-production flag changes don't need a review. Merge when the checks are green.`

              await setStatus('success', 'No review required')
            } else {
              for (const review of botApprovals.filter((r) => r.commit_id === pr.head.sha)) {
                await github.rest.pulls.dismissReview({
                  ...repo,
                  pull_number: pr.number,
                  review_id: review.id,
                  message: 'PR is no longer eligible for auto-approval.',
                })
              }

              if (gates.length === 0) {
                // Nothing for this workflow to police (e.g. infra-only PR) -
                // CODEOWNERS handles the review requirement.
                await setStatus('success', 'No flag changes to police')
                return
              }

              const teamList = (gate) =>
                gate.writers.map((team) => `@${ORG}/${team}`).join(' or ')

              if (unsatisfiedGates.length === 0) {
                body = `${MARKER}\n✅ **Approved by the writers team** - ready to merge when the checks are green.`
                await setStatus('success', 'Approved by the writers team')
              } else {
                const needs = unsatisfiedGates
                  .map((gate) => `- \`${gate.namespace}\`: ${teamList(gate)}`)
                  .join('\n')

                body = `${MARKER}\n⏳ **Needs approval from someone on the writers list** - this PR can't merge until each of these namespaces is approved by one of its writers:\n${needs}`
                await setStatus('pending', 'Awaiting approval from the writers team')
              }
            }

            // Summon the writers teams whenever the PR is gated - a team that
            // already has a pending review request isn't re-pinged.
            if (unsatisfiedGates.length > 0) {
              const { data: requested } = await github.rest.pulls.listRequestedReviewers({
                ...repo,
                pull_number: pr.number,
              })
              const alreadyRequested = new Set(requested.teams.map((team) => team.slug))
              const teamSlugs = [...new Set(unsatisfiedGates.flatMap((gate) => gate.writers))].filter(
                (slug) => !alreadyRequested.has(slug),
              )

              if (teamSlugs.length > 0) {
                await github.rest.pulls
                  .requestReviewers({ ...repo, pull_number: pr.number, team_reviewers: teamSlugs })
                  .catch(() => {})
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo,
              issue_number: pr.number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body?.includes(MARKER))

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ ...repo, comment_id: existing.id, body })
              }
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: pr.number, body })
            }
