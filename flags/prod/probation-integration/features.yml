version: "1.6"
namespace:
    key: probation-integration
    name: probation-integration
    description: Probation Integration Team
flags:
    - key: common-platform-record-creation-toggle
      name: common-platform-record-creation-toggle
      type: BOOLEAN_FLAG_TYPE
      description: Toggles whether the common-platform-and-delius service will create records to the database (enabled), or just log to telemetry (disabled).
      enabled: false
    - key: hdc-release-type
      name: HDC Release Type
      type: BOOLEAN_FLAG_TYPE
      description: HDC specific release type
      enabled: false
    - key: prison-identifiers-use-db-search
      name: prison-identifiers-use-db-search
      type: BOOLEAN_FLAG_TYPE
      description: Turns off the probation search /match endpoint and uses DB queries to match the offender
      enabled: false
    - key: semantic-contact-search
      name: semantic-contact-search
      type: BOOLEAN_FLAG_TYPE
      description: Use semantic contact search
      enabled: true
    - key: assessment-summary_update-risk-registrations-in-place
      name: Assessment Summary - SR32 Registration Changes
      type: BOOLEAN_FLAG_TYPE
      enabled: true
    - key: delius-ogrs4-support
      name: Assessment Summary / Risk Assessment Scores - OGRS4 changes
      type: BOOLEAN_FLAG_TYPE
      enabled: false
    - key: tier-v3-ui
      name: Tier V3 UI
      type: BOOLEAN_FLAG_TYPE
      description: (1st October) Whether to grant access to the V3 UI
      enabled: false
      rollouts:
        - segment:
            keys:
                - tier-v3-testers
            operator: OR_SEGMENT_OPERATOR
            value: true
    - key: tier-v3-calculation
      name: Tier V3 Calculation
      type: BOOLEAN_FLAG_TYPE
      description: Whether to store V3 calculations
      enabled: true
    - key: tier-v3-events
      name: Tier V3 Events
      type: BOOLEAN_FLAG_TYPE
      description: (1st October) Whether to emit v3 or v2 domain events
      enabled: false
    - key: tier-v3-delius-phase-1
      name: Tier V3 Delius Phase 1
      type: BOOLEAN_FLAG_TYPE
      description: (pre-September) Update the offender.v3_tier_id column
      enabled: true
    - key: tier-v3-delius-phase-2
      name: Tier V3 Delius Phase 2
      type: BOOLEAN_FLAG_TYPE
      description: (1st October) set v3 tier in the offender.current_tier column and create the management_tier history record
      enabled: false
    - key: tier-delius-active-cases-only
      name: Tier Delius - Active Cases Only
      type: BOOLEAN_FLAG_TYPE
      description: Disable tier updates to Delius unless the case has an active event
      enabled: true
    - key: tier-to-delius-sa2026-exclusions
      name: Tier - SA2026 Excluded Offence Moderator
      type: BOOLEAN_FLAG_TYPE
      description: (23rd September) Enable use of the R_OFFENCE.SA26_EXCLUDED_OFFENCE column
      enabled: false
    - key: calculate-key-dates-from-delius
      name: Calculate key dates using Delius
      type: BOOLEAN_FLAG_TYPE
      description: (26th September) When enabled calculates the final third date and emed date using data from delius. When disabled uses CRDS as input for calculations.
      enabled: false
segments:
    - key: tier-v3-testers
      name: Tier V3 Testers
      constraints:
        - type: STRING_COMPARISON_TYPE
          property: username
          operator: isoneof
          value:
            - MARCUSASPIN
      match_type: ALL_MATCH_TYPE
