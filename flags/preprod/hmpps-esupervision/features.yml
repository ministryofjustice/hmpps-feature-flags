version: "1.6"
namespace:
    key: hmpps-esupervision
    name: hmpps-esupervision
    description: Feature flags for the esupervision products
flags:
    - key: eligibilityFeatureToggle
      name: eligibilityFeatureToggle
      type: BOOLEAN_FLAG_TYPE
      description: Toggles whether the UI can display the refactored eligibility designs
      enabled: false
    - key: enableSentenceSelection
      name: enableSentenceSelection
      type: BOOLEAN_FLAG_TYPE
      enabled: false
    - key: useEligibilityEndpoint
      name: useEligibilityEndpoint
      type: BOOLEAN_FLAG_TYPE
      description: Manage online check ins eligibility journey asks the ESUP API's eligibility endpoint instead of applying its own rules
      enabled: false
