version: "1.6"
namespace:
    key: hmpps-esupervision
    name: hmpps-esupervision
    description: Feature flags for the esupervision products
flags:
    - key: eligibilityFeatureToggle
      name: eligibilityFeatureToggle
      type: BOOLEAN_FLAG_TYPE
      description: Toggles whether the UI can display the refactored eligibility designs
      enabled: false
    - key: mockAccreditedProgrammeTiersABToggle
      name: mockAccreditedProgrammeTiersABToggle
      type: BOOLEAN_FLAG_TYPE
      description: Turns on mock data to show the eligibility journey if a user was on an accredited programme and on Tiers A/B. Only to be used in DEV for testing
      enabled: false
    - key: newDesignPopHeader
      name: newDesignPopHeader
      type: BOOLEAN_FLAG_TYPE
      enabled: false
      rollouts:
        - segment:
            keys:
                - Just-James-King
            operator: OR_SEGMENT_OPERATOR
    - key: enableAdHocCheckIns
      name: enableAdHocCheckIns
      type: BOOLEAN_FLAG_TYPE
      description: Enables ad-hoc check in feature
      enabled: true
    - key: enablePersonHeaderTierV3
      name: enablePersonHeaderTierV3
      type: BOOLEAN_FLAG_TYPE
      enabled: true
segments:
    - key: Just-James-King
      name: Just James King
      match_type: ALL_MATCH_TYPE
