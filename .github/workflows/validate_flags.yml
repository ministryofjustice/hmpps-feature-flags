name: Validate Flags

on:
  pull_request:

permissions:
  contents: read

env:
  # Must match the image version in flipt/Dockerfile — the "Check Flipt version"
  # step fails the build if they drift.
  INSTALL_FLIPT_VERSION: v2.11.0
  INSTALL_FLIPT_ARCHIVE: flipt_linux_x86_64.tar.gz
  INSTALL_FLIPT_SHA256: e65f52d1ab599530df6feb9acd987d2b2b9d059b90538c654a7eabe95dafeae4
  GO_VERSION: 1.24.5

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Flipt version matches the deployed image
        run: |
          set -euo pipefail

          dockerfile_version="$(sed -n 's|^FROM ghcr.io/flipt-io/flipt:\(v[0-9][0-9.]*\)$|\1|p' flipt/Dockerfile)"

          if [ "${dockerfile_version}" != "${INSTALL_FLIPT_VERSION}" ]; then
            echo "INSTALL_FLIPT_VERSION (${INSTALL_FLIPT_VERSION}) does not match flipt/Dockerfile (${dockerfile_version})." >&2
            echo "Update INSTALL_FLIPT_VERSION and INSTALL_FLIPT_SHA256 in this workflow so flags are validated with the version that will be deployed." >&2
            exit 1
          fi
      - name: Install Flipt CLI
        run: |
          set -euo pipefail

          release_url="https://github.com/flipt-io/flipt/releases/download/${INSTALL_FLIPT_VERSION}"

          curl --fail --show-error --silent --location \
            --output "${INSTALL_FLIPT_ARCHIVE}" \
            "${release_url}/${INSTALL_FLIPT_ARCHIVE}"

          echo "${INSTALL_FLIPT_SHA256}  ${INSTALL_FLIPT_ARCHIVE}" | sha256sum --check --

          mkdir -p "${RUNNER_TEMP}/bin"
          extract_dir="$(mktemp -d)"
          tar --extract --gzip --directory "${extract_dir}" --file "${INSTALL_FLIPT_ARCHIVE}" flipt
          install -m 0755 "${extract_dir}/flipt" "${RUNNER_TEMP}/bin/flipt"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - run: make flags-validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make flags-lint
