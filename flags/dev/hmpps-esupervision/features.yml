version: "1.6"
namespace:
    key: hmpps-esupervision
    name: hmpps-esupervision
    description: Feature flags for the esupervision products
flags:
    - key: eligibilityFeatureToggle
      name: eligibilityFeatureToggle
      type: BOOLEAN_FLAG_TYPE
      description: Toggles whether the UI can display the refactored eligibility designs
      enabled: true
    - key: mockAccreditedProgrammeTiersABToggle
      name: mockAccreditedProgrammeTiersABToggle
      type: BOOLEAN_FLAG_TYPE
      description: Turns on mock data to show the eligibility journey if a user was on an accredited programme and on Tiers A/B
      enabled: true
