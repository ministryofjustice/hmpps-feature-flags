services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  flipt:
    build:
      context: ..
      dockerfile: flipt/Dockerfile
    user: root
    ports:
      - "8080:8080"
    volumes:
      - ./config/local.yml:/etc/flipt/config/default.yml:ro
    environment:
      - FLIPT_AUTHORIZATION_LOCAL_DATA_PATH=/var/opt/flipt/acl-data.json
      - FLIPT_DEFAULT_ENVIRONMENT=dev
      - FLIPT_LOG_LEVEL=debug
      - FLIPT_LOCAL_ADMIN_TOKEN=local-admin-token
      - FLIPT_GITHUB_CLIENT_ID=${FLIPT_GITHUB_CLIENT_ID:-change-me}
      - FLIPT_GITHUB_CLIENT_SECRET=${FLIPT_GITHUB_CLIENT_SECRET:-change-me}
      - FLIPT_GITHUB_APP_INSTALLATION_ID=${FLIPT_GITHUB_APP_INSTALLATION_ID:-}
      - FLIPT_GITHUB_APP_PRIVATE_KEY_B64=${FLIPT_GITHUB_APP_PRIVATE_KEY_B64:-}
      - FLIPT_REDIS_HOST=redis
      - FLIPT_REDIS_AUTH_TOKEN=
      - FLIPT_SESSION_CSRF_KEY=local-dev-csrf-key-not-for-production
    depends_on:
      - redis
