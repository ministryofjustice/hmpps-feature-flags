version: "1.6"
namespace:
    key: hmpps-arns-assessment-platform
    name: hmpps-arns-assessment-platform
    description: ARNS Assessment platform
flags:
    - key: sp-enable-smart-survey-in-private-beta
      name: sp-enable-smart-survey-in-private-beta
      type: BOOLEAN_FLAG_TYPE
      enabled: false
    - key: sp-enable-smart-survey-in-national-rollout
      name: sp-enable-smart-survey-in-national-rollout
      type: BOOLEAN_FLAG_TYPE
      enabled: false
    - key: sp-enable-print-and-share
      name: sp-enable-print-and-share
      type: BOOLEAN_FLAG_TYPE
      enabled: true
    - key: sp-enable-supervision-package
      name: sp-enable-supervision-package
      type: BOOLEAN_FLAG_TYPE
      enabled: true
    - key: sp-downtime-notification-banner
      name: sp-downtime-notification-banner
      type: BOOLEAN_FLAG_TYPE
      enabled: false
    - key: sp-downtime-notification-banner-content
      name: sp-downtime-notification-banner-content
      type: VARIANT_FLAG_TYPE
      description: ' Holds the heading and message for the downtime banner'
      enabled: false
      variants:
        - key: announcement
          description: Controls the content of the Sentence Plan downtime notification banner. The selected variant must include a JSON attachment with non-empty heading and message fields. If the flag is disabled, the banner is not shown.
          attachment:
            heading: Downtime Notification
            message: This is a test notification
